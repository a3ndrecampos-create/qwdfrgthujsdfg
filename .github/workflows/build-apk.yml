name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:   # permite rodar manualmente: gh workflow run build-apk.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Instala o Gradle 8.9 direto no runner (o projeto não precisa do gradlew/wrapper).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK debug
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: loja-no-carro-debug
          path: app/build/outputs/apk/debug/*.apk
